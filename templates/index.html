<!DOCTYPE html>
<html>
<head>
    <title>Réservation</title>

    <style>
        body { font-family: Arial; background:#eee; margin:20px; }

        .top-row { display:flex; gap:10px; align-items:center; }

        input, select {
            height:30px;
            padding:5px;
        }

        .salle-box {
            border:1px solid #ccc;
            background:white;
            width:80px;
            height:280px;
            overflow-y:auto;
            display:none;
        }

        .salle-box div {
            padding:4px;
            cursor:pointer;
        }

        .selected { background:blue; color:white; }

        .buttons {
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .btn-blue { background:#2f6de1; color:white; padding:8px; border:none; }
        .btn-green { background:#2e8b57; color:white; padding:8px; border:none; }
        .btn-red { background:#c0392b; color:white; padding:8px; border:none; }

        table {
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
            background:white;
        }

        td, th {
            border:1px solid #ccc;
            padding:6px;
            text-align:center;
        }

        tr.selected-row {
            background:#ffdddd;
        }

    </style>
</head>

<body>

<h2>Réservation</h2>

<form method="POST">

<div class="top-row">

    <input name="titre" placeholder="Titre">
    <input name="organisateur" placeholder="Organisateur">

    <select id="etage" name="etage">
        <option value="">Etage</option>
        <option value="ground floor">Ground</option>
        <option value="first floor">1 er</option>
        <option value="second floor">2 eme</option>
        <option value="third floor">3 eme</option>
        <option value="fourth floor">4 eme</option>
    </select>

    <select name="type">
        <option>Class</option>
        <option>Lab</option>
    </select>

    <select name="genre">
        <option>Male</option>
        <option>Female</option>
    </select>

    <select name="periode">
        <option>Matin</option>
        <option>Soir</option>
    </select>

    <input type="date" name="debut">
    <input type="date" name="fin">

    <input id="salle_input" name="salle" placeholder="Salle" readonly>

    <div class="salle-box" id="salles">
        {% for s in salles %}
        <div data-etage="{{ s.etage }}" onclick="selectSalle(this)">
            {{ s.nom }}
        </div>
        {% endfor %}
    </div>

    <div class="buttons">
        <button type="button" class="btn-blue" onclick="voirDisponibilite()">voir disponibilité</button>
        <button type="submit" class="btn-green">Réserver</button>
    </div>

</div>

</form>

<h2>Liste</h2>

<form method="POST" action="/delete" id="deleteForm">
<input type="hidden" name="id" id="delete_id">

<table id="table">
<tr>
    <th>ID</th><th>Type</th><th>Etage</th><th>Salle</th>
    <th>Genre</th><th>Période</th><th>Début</th><th>Fin</th>
    <th>Titre</th><th>Organisateur</th>
</tr>

{% for r in data %}
<tr onclick="selectRow(this, {{ r[0] }})">
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>{{ r[5] }}</td>
    <td>{{ r[6] }}</td>
    <td>{{ r[7] }}</td>
    <td>{{ r[8] }}</td>
    <td>{{ r[9] }}</td>
</tr>
{% endfor %}

</table>

<br>
<button type="submit" class="btn-red">Supprimer sélection</button>

</form>

<script>

function voirDisponibilite() {
    let etage = document.getElementById("etage").value;
    if (!etage) { alert("Choisir étage"); return; }

    let box = document.getElementById("salles");
    box.style.display = "block";

    document.querySelectorAll("#salles div").forEach(s => {
        s.style.display = s.dataset.etage === etage ? "block" : "none";
    });
}

function selectSalle(el) {
    document.querySelectorAll("#salles div").forEach(s => s.classList.remove("selected"));
    el.classList.add("selected");
    document.getElementById("salle_input").value = el.innerText;
}

function selectRow(row, id) {
    document.querySelectorAll("#table tr").forEach(r => r.classList.remove("selected-row"));
    row.classList.add("selected-row");
    document.getElementById("delete_id").value = id;
}

</script>

</body>
</html>
