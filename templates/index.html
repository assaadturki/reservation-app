<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز القاعات</title>

<style>
body { font-family: Arial; direction: rtl; background:#eee; }

.grid {
    display:grid;
    grid-template-columns: repeat(13, 60px);
    gap:5px;
    margin-bottom:20px;
}

.salle {
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
    cursor:pointer;
}

.dispo { background:#d4edda; }
.occupe { background:#f8d7da; }

.selected-row { background:#ffe0e0; }

table { width:100%; background:white; border-collapse:collapse; }
td,th { border:1px solid #ccc; padding:5px; text-align:center; }

.btn { padding:8px; border:none; cursor:pointer; }
.blue { background:#2f6de1; color:white; }
</style>
</head>

<body>

<h2>حجز القاعات</h2>

<div>
<input type="date" id="debut">
<input type="date" id="fin">
<button class="btn blue" onclick="loadDispo()">عرض القاعات</button>
</div>

<br>

<div id="grid" class="grid">
{% for s in salles %}
<div class="salle" data-salle="{{ s }}" onclick="assignSalle(this)">
{{ s }}
</div>
{% endfor %}
</div>

<h3>قائمة الحجوزات</h3>

<table id="table">
<tr>
<th>ID</th><th>القاعة</th><th>البداية</th><th>النهاية</th>
</tr>

{% for r in data %}
<tr onclick="selectRow(this, {{ r[0] }})">
<td>{{ r[0] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[6] }}</td>
<td>{{ r[7] }}</td>
</tr>
{% endfor %}
</table>

<script>

let selectedId = null;

function selectRow(row, id){
    document.querySelectorAll("#table tr").forEach(r=>r.classList.remove("selected-row"));
    row.classList.add("selected-row");
    selectedId = id;
}

function loadDispo(){
    let debut = document.getElementById("debut").value;
    let fin = document.getElementById("fin").value;

    fetch("/disponibilite", {
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({debut:debut, fin:fin})
    })
    .then(res=>res.json())
    .then(data=>{
        document.querySelectorAll(".salle").forEach(el=>{
            let nom = el.dataset.salle;

            if(data.occupees.includes(nom)){
                el.classList.remove("dispo");
                el.classList.add("occupe");
            } else {
                el.classList.remove("occupe");
                el.classList.add("dispo");
            }
        });
    });
}

function assignSalle(el){
    if(!selectedId){
        alert("اختر حجز من الجدول");
        return;
    }

    fetch("/assign", {
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            id: selectedId,
            salle: el.dataset.salle
        })
    }).then(()=>location.reload());
}

</script>

</body>
</html>
