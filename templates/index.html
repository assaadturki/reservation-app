<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز القاعات</title>
<style>
body{font-family:Arial;background:#eee;margin:20px;direction:rtl}
h2{margin:10px 0}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input,select{height:32px;padding:5px}

.buttons{display:flex;gap:10px}
.btn{padding:8px 12px;border:none;cursor:pointer}
.btn-blue{background:#2f6de1;color:#fff}
.btn-green{background:#2e8b57;color:#fff}
.btn-red{background:#c0392b;color:#fff}

#salles_container{background:#fff;border:1px solid #ccc;padding:10px;margin-bottom:10px}
.floor{margin-bottom:10px}
.floor h4{margin:5px 0}
.row{display:flex;gap:5px;flex-wrap:wrap}
.salle{width:55px;text-align:center;padding:6px;border:1px solid #aaa;background:#f5f5f5;cursor:pointer}
.salle.dispo{background:#b8f5b8}
.salle.occupe{background:#f5b8b8}

table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
tr.selected-row{background:#ffe0e0}
</style>
</head>

<body>

<h2>حجز القاعات</h2>

<!-- Import / Export -->
<div class="toolbar">
<a href="/export"><button type="button" class="btn btn-blue">تصدير إكسل</button></a>

<form action="/import" method="POST" enctype="multipart/form-data">
<input type="file" name="file" required>
<button class="btn btn-green">استيراد إكسل</button>
</form>
</div>

<!-- Form -->
<form method="POST" id="mainForm">
<input type="hidden" name="id" id="id">
<input type="hidden" name="action" id="action">

<div class="toolbar">
<input id="titre" name="titre" placeholder="العنوان">
<input id="organisateur" name="organisateur" placeholder="المنظم">

<select id="etage" name="etage">
<option value="">الطابق</option>
<option value="ground floor">الأرضي</option>
<option value="first floor">الأول</option>
<option value="second floor">الثاني</option>
<option value="third floor">الثالث</option>
<option value="fourth floor">الرابع</option>
</select>

<select id="type" name="type">
<option value="">النوع</option>
<option value="Class">قاعة</option>
<option value="Lab">مختبر</option>
</select>

<select id="genre" name="genre">
<option value="">الجنس</option>
<option value="Male">رجال</option>
<option value="Female">نساء</option>
</select>

<select id="periode" name="periode">
<option value="">الفترة</option>
<option value="Matin">صباحي</option>
<option value="Soir">مسائي</option>
</select>

<input id="debut" type="date" name="debut">
<input id="fin" type="date" name="fin">

<input id="salle_input" name="salle" placeholder="القاعة" readonly>

<div class="buttons">
<button type="button" class="btn btn-blue" onclick="loadDispo()">عرض القاعات</button>
<button type="submit" class="btn btn-green">حفظ / تعديل</button>
</div>
</div>
</form>

<!-- Salles grid -->
<div id="salles_container">
<div class="floor"><h4>الأرضي</h4><div class="row">
<div class="salle" data-salle="G 11">G 11</div>
<div class="salle" data-salle="G 12">G 12</div>
<div class="salle" data-salle="G 13">G 13</div>
</div></div>
</div>

<h2>قائمة الحجوزات</h2>

<form method="POST" action="/delete" id="deleteForm">
<table id="table">
<tr>
<th></th>
<th>ID</th>
<th>النوع</th>
<th>الطابق</th>
<th>القاعة</th>
<th>الجنس</th>
<th>الفترة</th>
<th>البداية</th>
<th>النهاية</th>
<th>العنوان</th>
<th>المنظم</th>
</tr>

{% for r in data %}
<tr onclick="selectRow(this, {{ r[0] }})">
<td><input type="checkbox" name="ids[]" value="{{ r[0] }}"></td>
<td>{{ r[0] }}</td>
<td>{{ r[1] }}</td>
<td>{{ r[2] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[4] }}</td>
<td>{{ r[5] }}</td>
<td>{{ r[6] }}</td>
<td>{{ r[7] }}</td>
<td>{{ r[8] }}</td>
<td>{{ r[9] }}</td>
</tr>
{% endfor %}
</table>

<br>
<button class="btn btn-red">حذف المحدد</button>
</form>

<script>
let selectedId=null;

function selectRow(row,id){
document.querySelectorAll("#table tr").forEach(r=>r.classList.remove("selected-row"));
row.classList.add("selected-row");
selectedId=id;

let c=row.children;
document.getElementById("id").value=id;
document.getElementById("action").value="update";

document.getElementById("type").value=c[2].innerText;
document.getElementById("etage").value=c[3].innerText;
document.getElementById("salle_input").value=c[4].innerText;
document.getElementById("genre").value=c[5].innerText;
document.getElementById("periode").value=c[6].innerText;
document.getElementById("debut").value=c[7].innerText;
document.getElementById("fin").value=c[8].innerText;
document.getElementById("titre").value=c[9].innerText;
document.getElementById("organisateur").value=c[10].innerText;
}

function loadDispo(){
let debut=document.getElementById("debut").value;
let fin=document.getElementById("fin").value;

fetch("/disponibilite",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({debut:debut,fin:fin})
})
.then(res=>res.json())
.then(data=>{
document.querySelectorAll(".salle").forEach(el=>{
let s=el.dataset.salle;
el.classList.remove("dispo","occupe");
if(data.occupees.includes(s)){el.classList.add("occupe")}
else{el.classList.add("dispo")}
})
})
}

document.querySelectorAll(".salle").forEach(el=>{
el.onclick=function(){
if(!selectedId){alert("اختر سطر");return;}
fetch("/assign",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({id:selectedId,salle:el.dataset.salle})
}).then(()=>location.reload());
}
});
</script>

</body>
</html>
