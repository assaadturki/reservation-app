<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Réservation</title>

<style>
body { font-family: Arial; background:#f5f5f5; margin:20px; }

.container {
    display:grid;
    grid-template-columns: 1fr 250px;
    gap:20px;
}

.form-row {
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

input, select {
    height:32px;
    padding:5px;
    border:1px solid #ccc;
}

.w1 { width:180px; }
.w2 { width:200px; }
.w3 { width:140px; }

.box {
    background:white;
    border:1px solid #ccc;
    padding:10px;
    height:200px;
    overflow:auto;
}

.box div { padding:4px; cursor:pointer; }
.box div:hover { background:#eee; }

.btn {
    width:100%;
    padding:10px;
    border:none;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

.blue { background:#2d6cdf; }
.green { background:#2e8b57; }
.red { background:#c0392b; }

table {
    width:100%;
    border-collapse: collapse;
    margin-top:20px;
    background:white;
}

th, td {
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

th { background:#eee; }
</style>

<script>

const SALLES = {{ salles|tojson }};
let selectedRow = null;

function filterSalles() {
    let etage = document.getElementById("etage").value;
    let container = document.getElementById("salles_list");

    container.innerHTML = "";

    if (!etage) return;

    let filtered = SALLES.filter(s => s.etage === etage);

    filtered.forEach(s => {
        let div = document.createElement("div");
        div.innerText = s.nom;

        div.onclick = function(){
            document.getElementById("salle").value = s.nom;
        };

        container.appendChild(div);
    });
}

function selectRow(row, id){
    if (selectedRow){
        selectedRow.style.background="";
        selectedRow.style.color="";
    }
    row.style.background="blue";
    row.style.color="white";
    selectedRow=row;
    document.getElementById("selected_id").value=id;
}

</script>
</head>

<body>

<h2>Réservation</h2>

{% if erreur %}
<p style="color:red">{{ erreur }}</p>
{% endif %}

<form method="POST">

<div class="container">

<div>

<div class="form-row">
<input class="w2" name="titre" placeholder="Titre">
<input class="w2" name="organisateur" placeholder="Organisateur">
<input class="w3" type="date" name="debut">
<input class="w3" type="date" name="fin">
</div>

<div class="form-row">
<select id="etage" class="w3" name="etage" onchange="filterSalles()">
<option value="">Etage</option>
<option value="ground floor">Ground</option>
<option value="first floor">1 er</option>
<option value="second floor">2 eme</option>
<option value="third floor">3 eme</option>
<option value="fourth floor">4 eme</option>
</select>

<select class="w3" name="type">
<option>Class</option>
<option>Lab</option>
</select>

<select class="w3" name="genre">
<option>Male</option>
<option>Female</option>
</select>

<select class="w3" name="periode">
<option>Matin</option>
<option>Soir</option>
</select>

<input id="salle" class="w3" name="salle" placeholder="Salle">
</div>

</div>

<div>

<div class="box">
<b>Selection Salle</b>
<div id="salles_list"></div>
</div>

<button class="btn blue" name="action" value="dispo">voir disponibilité</button>
<button class="btn green" name="action" value="reserver">Réserver</button>

</div>

</div>

<input type="hidden" id="selected_id" name="selected_id">

<table>
<tr>
<th>ID</th>
<th>Type</th>
<th>Etage</th>
<th>Salle</th>
<th>Genre</th>
<th>Période</th>
<th>Début</th>
<th>Fin</th>
<th>Titre</th>
<th>Organisateur</th>
</tr>

{% for r in data %}
<tr onclick="selectRow(this,'{{r[0]}}')">
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[3]}}</td>
<td>{{r[2]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
<td>{{r[8]}}</td>
<td>{{r[9]}}</td>
</tr>
{% endfor %}
</table>

<button class="btn red" name="action" value="delete">
Supprimer Réservation
</button>

</form>

</body>
</html>
