<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حجز القاعات</title>

<style>
body { font-family: Arial; background:#eee; margin:20px; direction: rtl; }

.top-row { display:flex; gap:10px; flex-wrap:wrap; }

input, select { height:30px; padding:5px; }

.salle-box {
    border:1px solid #ccc;
    background:white;
    width:140px;
    height:260px;
    overflow-y:auto;
    display:none;
}

.salle-box div { padding:5px; cursor:pointer; }
.selected { background:blue; color:white; }

.btn { padding:6px; border:none; cursor:pointer; color:white; }
.blue{background:#2f6de1}
.green{background:#2e8b57}
.red{background:#c0392b}

table { width:100%; margin-top:20px; border-collapse:collapse; background:white; }
td, th { border:1px solid #ccc; padding:5px; text-align:center; }
</style>
</head>

<body>

<h2>حجز القاعات</h2>

<form method="POST">

<div class="top-row">

<input name="titre" placeholder="العنوان">
<input name="organisateur" placeholder="المنظم">

<select id="etage" name="etage">
<option value="">الطابق</option>
<option value="ground floor">الأرضي</option>
<option value="first floor">الأول</option>
<option value="second floor">الثاني</option>
<option value="third floor">الثالث</option>
<option value="fourth floor">الرابع</option>
</select>

<select name="type">
<option>Class</option>
<option>Lab</option>
</select>

<select name="genre">
<option>Male</option>
<option>Female</option>
</select>

<select name="periode">
<option>Matin</option>
<option>Soir</option>
</select>

<input type="date" name="debut">
<input type="date" name="fin">

<input id="salle_input" name="salle" placeholder="القاعة" readonly>

<div class="salle-box" id="salles">
{% for s in salles %}
<div data-etage="{{ s.etage }}" onclick="selectSalle(this)">
{{ s.nom }}
</div>
{% endfor %}
</div>

<button type="button" class="btn blue" onclick="voir()">عرض القاعات</button>
<button class="btn green">حفظ</button>

</div>
</form>

<h3>قائمة الحجوزات</h3>

<table id="table">
<tr>
<th></th><th>ID</th><th>Salle</th><th>Début</th><th>Fin</th>
</tr>

{% for r in data %}
<tr>
<td><input type="checkbox" value="{{ r[0] }}"></td>
<td>{{ r[0] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[6] }}</td>
<td>{{ r[7] }}</td>
</tr>
{% endfor %}
</table>

<button class="btn red" onclick="deleteSelected()">حذف</button>

<script>

function voir(){
let etage=document.getElementById("etage").value;
let box=document.getElementById("salles");

if(!etage){alert("اختر الطابق");return;}

box.style.display="block";

document.querySelectorAll("#salles div").forEach(s=>{
s.style.display = (s.dataset.etage===etage) ? "block":"none";
});
}

function selectSalle(el){
document.querySelectorAll("#salles div").forEach(s=>s.classList.remove("selected"));
el.classList.add("selected");
document.getElementById("salle_input").value=el.innerText;
}

function deleteSelected(){
let ids=[];
document.querySelectorAll("input[type=checkbox]:checked").forEach(c=>{
ids.push(c.value);
});

fetch("/delete",{
method:"POST",
headers:{'Content-Type':'application/x-www-form-urlencoded'},
body: ids.map(id=>"ids[]="+id).join("&")
}).then(()=>location.reload());
}

</script>

</body>
</html>
