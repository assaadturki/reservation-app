<!DOCTYPE html>
<html>
<head>
    <title>Réservation</title>

    <style>
        body {
            font-family: Arial;
            background: #eee;
            margin: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        /* ===== LIGNE PRINCIPALE ===== */
        .top-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input, select {
            height: 30px;
            padding: 5px;
            min-width: 120px;
        }

        .small {
            width: 100px;
        }

        .date {
            width: 140px;
        }

        /* ===== BLOC SALLES ===== */
        .salle-box {
            border: 1px solid #ccc;
            background: #fff;
            width: 80px;
            height: 260px;
            overflow-y: auto;
            font-size: 13px;
        }

        .salle-box div {
            padding: 3px;
            cursor: pointer;
        }

        .salle-box div:hover {
            background: #ddd;
        }

        .selected {
            background: blue;
            color: white;
        }

        /* ===== BOUTONS ===== */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 10px;
        }

        .btn-blue {
            background: #2f6de1;
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
        }

        .btn-green {
            background: #2e8b57;
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
        }

        .btn-red {
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 13px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

    </style>
</head>

<body>

<h2>Réservation</h2>

<form method="POST">

<div class="top-row">

    <input name="titre" placeholder="Titre">
    <input name="organisateur" placeholder="Organisateur">

    <select name="etage" id="etage" onchange="filtrerSalles()">
        <option value="">Etage</option>
        <option value="ground floor">Ground</option>
        <option value="first floor">1 er</option>
        <option value="second floor">2 eme</option>
        <option value="third floor">3 eme</option>
        <option value="fourth floor">4 eme</option>
    </select>

    <select name="type">
        <option>Class</option>
        <option>Lab</option>
    </select>

    <select name="genre">
        <option>Male</option>
        <option>Female</option>
    </select>

    <select name="periode">
        <option>Matin</option>
        <option>Soir</option>
    </select>

    <input type="date" name="debut" class="date">
    <input type="date" name="fin" class="date">

    <input id="salle_input" name="salle" placeholder="Salle" readonly>

    <!-- ===== LISTE SALLES ===== -->
    <div class="salle-box" id="salles">
        {% for s in salles %}
        <div data-etage="{{ s.etage }}" onclick="selectSalle(this)">
            {{ s.nom }}
        </div>
        {% endfor %}
    </div>

    <!-- ===== BOUTONS ===== -->
    <div class="buttons">
        <button type="button" class="btn-blue">voir disponibilité</button>
        <button type="submit" class="btn-green">Réserver</button>
    </div>

</div>

</form>

<h2>Liste des réservation</h2>

<table>
<tr>
    <th>ID</th>
    <th>Type</th>
    <th>Etage</th>
    <th>Salle</th>
    <th>Genre</th>
    <th>Période</th>
    <th>Début</th>
    <th>Fin</th>
    <th>Titre</th>
    <th>Organisateur</th>
</tr>

{% for r in data %}
<tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[4] }}</td>
    <td>{{ r[8] }}</td>
    <td>{{ r[6] }}</td>
    <td>{{ r[7] }}</td>
    <td>{{ r[5] }}</td>
    <td>{{ r[6] }}</td>
</tr>
{% endfor %}
</table>

<form method="POST" action="/delete_all">
    <button class="btn-red">Supprimer Réservation</button>
</form>

<!-- ===== SCRIPT ===== -->
<script>
function filtrerSalles() {
    let etage = document.getElementById("etage").value;
    let salles = document.querySelectorAll("#salles div");

    salles.forEach(s => {
        if (s.getAttribute("data-etage") === etage || etage === "") {
            s.style.display = "block";
        } else {
            s.style.display = "none";
        }
    });
}

function selectSalle(el) {
    document.querySelectorAll("#salles div").forEach(s => s.classList.remove("selected"));
    el.classList.add("selected");
    document.getElementById("salle_input").value = el.innerText;
}
</script>

</body>
</html>
