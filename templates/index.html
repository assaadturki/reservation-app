<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Réservation</title>

<style>
body { font-family: Arial; margin:20px; }

.container {
    display:flex;
    gap:20px;
    max-width:1200px;
}

.left { flex:3; }
.right { width:220px; }

.row {
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

input, select {
    padding:5px;
    height:30px;
}

.small { width:110px; }
.medium { width:140px; }
.large { width:180px; }

.box {
    border:1px solid #ccc;
    padding:10px;
    height:150px;
    overflow:auto;
}

.btn {
    padding:8px 12px;
    color:white;
    border:none;
    cursor:pointer;
}

.blue { background:#2f5bea; }
.green { background:#2e8b57; }
.red { background:#c0392b; }

table {
    width:100%;
    border-collapse: collapse;
    margin-top:20px;
}

th, td {
    border:1px solid #ccc;
    padding:5px;
    text-align:center;
}
</style>

<script>

const SALLES = {{ salles|tojson }};
let selectedRow = null;

// 🔥 filtrer salles par étage
function filterSalles() {

    let etage = document.getElementById("etage").value;
    let container = document.getElementById("salles_list");

    container.innerHTML = "";

    if (!etage) return; // rien au début

    let filtered = SALLES.filter(s => s.etage === etage);

    filtered.forEach(s => {
        let div = document.createElement("div");
        div.innerText = s.nom;
        div.style.cursor = "pointer";

        div.onclick = function(){
            document.getElementById("salle").value = s.nom;
        };

        container.appendChild(div);
    });
}

// 🔵 selection ligne tableau
function selectRow(row, id) {

    if (selectedRow) {
        selectedRow.style.background = "";
        selectedRow.style.color = "";
    }

    row.style.background = "blue";
    row.style.color = "white";

    selectedRow = row;

    document.getElementById("selected_id").value = id;
}

</script>

</head>

<body>

<h2>Réservation</h2>

{% if erreur %}
<p style="color:red">{{ erreur }}</p>
{% endif %}

<form method="POST">

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="row">
<input class="large" name="titre" placeholder="Titre">
<input class="large" name="organisateur" placeholder="Organisateur">

<select id="etage" name="etage" onchange="filterSalles()">
<option value="">-- Etage --</option>
<option value="ground floor">Ground</option>
<option value="first floor">1 er</option>
<option value="second floor">2 eme</option>
<option value="third floor">3 eme</option>
<option value="fourth floor">4 eme</option>
</select>

<select name="type">
<option>Class</option>
<option>Lab</option>
</select>

<select name="genre">
<option>Male</option>
<option>Female</option>
</select>

<select name="periode">
<option>Matin</option>
<option>Soir</option>
</select>

<input type="date" name="debut">
<input type="date" name="fin">

<input id="salle" name="salle" placeholder="Salle">

</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="box">
<b>Selection Salle</b><br>
<div id="salles_list"></div>
</div>

<br>

<button class="btn blue" name="action" value="dispo">
voir disponibilité
</button>

<br><br>

<button class="btn green" name="action" value="reserver">
Réserver
</button>

</div>

</div>

<!-- TABLE -->
<input type="hidden" id="selected_id" name="selected_id">

<table>
<tr>
<th>ID</th>
<th>Type</th>
<th>Etage</th>
<th>Salle</th>
<th>Genre</th>
<th>Période</th>
<th>Début</th>
<th>Fin</th>
<th>Titre</th>
<th>Organisateur</th>
</tr>

{% for r in data %}
<tr onclick="selectRow(this, '{{ r[0] }}')">
<td>{{ r[0] }}</td>
<td>{{ r[1] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[2] }}</td>
<td>{{ r[4] }}</td>
<td>{{ r[5] }}</td>
<td>{{ r[6] }}</td>
<td>{{ r[7] }}</td>
<td>{{ r[8] }}</td>
<td>{{ r[9] }}</td>
</tr>
{% endfor %}
</table>

<br>

<button class="btn red" name="action" value="delete">
Supprimer Réservation
</button>

</form>

</body>
</html>
